services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: poland_macro_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - poland_macro_mssql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  poland_macro_mssql_data:
